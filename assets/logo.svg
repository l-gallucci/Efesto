<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="920" height="170">
  <defs>
    <marker id="arrowOx" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
    <!-- paths for curved text labels -->
    <path id="topArcText"
          d="M 40,57 A 52,52 0 0,1 144,57"/>
    <path id="botArcText"
          d="M 40,113 A 52,52 0 0,0 144,113"/>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="170" rx="14" fill="url(#bg)"/>

  <!-- ── LEFT: redox cycling wheel ──────────────────────────── -->
  <!-- circle: cx=92, cy=85, r=52 → y: 33–137  x: 40–144      -->

  <!-- guide ring -->
  <circle cx="92" cy="85" r="52" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Oxidation arc: left → right across the top, amber -->
  <path d="M 44,59 A 52,52 0 0,1 140,59"
        fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"
        marker-end="url(#arrowOx)"/>

  <!-- Reduction arc: right → left across the bottom, blue -->
  <path d="M 140,111 A 52,52 0 0,1 44,111"
        fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"
        marker-end="url(#arrowRed)"/>

  <!-- Curved "OXIDATION" label following top arc (outside circle) -->
  <text font-family="Arial, sans-serif" font-size="9" font-weight="bold"
        fill="#f59e0b" opacity="0.85" letter-spacing="1">
    <textPath href="#topArcText" startOffset="18%">OXIDATION</textPath>
  </text>

  <!-- Curved "REDUCTION" label following bottom arc (outside circle) -->
  <text font-family="Arial, sans-serif" font-size="9" font-weight="bold"
        fill="#60a5fa" opacity="0.85" letter-spacing="1">
    <textPath href="#botArcText" startOffset="18%">REDUCTION</textPath>
  </text>

  <!-- Centre genome icon -->
  <circle cx="92" cy="85" r="20" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M 80,78 Q 92,71 104,78" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 80,85 Q 92,78 104,85" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 80,92 Q 92,85 104,92" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round"/>

  <!-- subtitle under wheel -->
  <text x="92" y="158" font-family="Arial, sans-serif" font-size="8.5"
        fill="#475569" text-anchor="middle">Fe · Mn cycling</text>

  <!-- left divider -->
  <line x1="185" y1="28" x2="185" y2="145" stroke="#334155" stroke-width="1"/>

  <!-- ── CENTRE: title ──────────────────────────────────────── -->
  <text x="437" y="84" font-family="'Courier New', monospace" font-size="42"
        fill="#f1f5f9" text-anchor="middle" font-weight="bold" letter-spacing="2">Efesto</text>
  <text x="437" y="115" font-family="Arial, sans-serif" font-size="13"
        fill="#64748b" text-anchor="middle">Metal cycling gene annotation · genomes &amp; metagenomes</text>

  <!-- right divider -->
  <line x1="690" y1="28" x2="690" y2="145" stroke="#334155" stroke-width="1"/>

  <!-- ── RIGHT: element tiles ───────────────────────────────── -->
  <!-- 3 × 2 grid  |  tile: 64 × 58 px  |  gap: 8 px          -->
  <!-- Col x-left: 698  766  834   |  Row y-top: 24  90        -->

  <!-- Fe  26  purple -->
  <rect x="698" y="24" width="64" height="58" rx="7" fill="#5b21b6" opacity="0.9"/>
  <text x="730" y="55" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Fe</text>
  <text x="703" y="35" font-family="Arial, sans-serif" font-size="8" fill="#c4b5fd">iron</text>
  <text x="757" y="74" font-family="Arial, sans-serif" font-size="9" fill="#ddd6fe" text-anchor="end">26</text>

  <!-- Mn  25  ocean blue -->
  <rect x="770" y="24" width="64" height="58" rx="7" fill="#0369a1" opacity="0.9"/>
  <text x="802" y="55" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Mn</text>
  <text x="775" y="35" font-family="Arial, sans-serif" font-size="8" fill="#7dd3fc">Mn</text>
  <text x="829" y="74" font-family="Arial, sans-serif" font-size="9" fill="#bae6fd" text-anchor="end">25</text>

  <!-- Cu  29  amber-brown -->
  <rect x="842" y="24" width="64" height="58" rx="7" fill="#92400e" opacity="0.9"/>
  <text x="874" y="55" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Cu</text>
  <text x="847" y="35" font-family="Arial, sans-serif" font-size="8" fill="#fcd34d">copper</text>
  <text x="901" y="74" font-family="Arial, sans-serif" font-size="9" fill="#fde68a" text-anchor="end">29</text>

  <!-- Zn  30  teal -->
  <rect x="698" y="90" width="64" height="58" rx="7" fill="#065f46" opacity="0.9"/>
  <text x="730" y="121" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Zn</text>
  <text x="703" y="101" font-family="Arial, sans-serif" font-size="8" fill="#6ee7b7">zinc</text>
  <text x="757" y="140" font-family="Arial, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="end">30</text>

  <!-- Mo  42  dark red -->
  <rect x="770" y="90" width="64" height="58" rx="7" fill="#7f1d1d" opacity="0.9"/>
  <text x="802" y="121" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Mo</text>
  <text x="775" y="101" font-family="Arial, sans-serif" font-size="8" fill="#f87171">Mo</text>
  <text x="829" y="140" font-family="Arial, sans-serif" font-size="9" fill="#fca5a5" text-anchor="end">42</text>

  <!-- As  33  olive green -->
  <rect x="842" y="90" width="64" height="58" rx="7" fill="#3f6212" opacity="0.9"/>
  <text x="874" y="121" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">As</text>
  <text x="847" y="101" font-family="Arial, sans-serif" font-size="8" fill="#bef264">arsenic</text>
  <text x="901" y="140" font-family="Arial, sans-serif" font-size="9" fill="#d9f99d" text-anchor="end">33</text>

</svg>
