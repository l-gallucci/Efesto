<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 160" width="820" height="160">
  <defs>
    <marker id="arrowOx" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="160" rx="14" fill="url(#bg)"/>

  <!-- ── LEFT: redox cycling wheel ── -->
  <!-- outer ring -->
  <circle cx="100" cy="80" r="58" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Oxidation arc (top, amber) -->
  <path d="M 58,47  A 58,58 0 0,1 142,47"
        fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrowOx)"/>
  <!-- Reduction arc (bottom, blue) -->
  <path d="M 142,113 A 58,58 0 0,1 58,113"
        fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrowRed)"/>

  <!-- Fe²⁺ label (bottom) -->
  <text x="100" y="128" font-family="'Courier New', monospace" font-size="13"
        fill="#60a5fa" text-anchor="middle" font-weight="bold">Fe²⁺  Mn²⁺</text>
  <!-- Fe³⁺ label (top) -->
  <text x="100" y="40" font-family="'Courier New', monospace" font-size="13"
        fill="#f59e0b" text-anchor="middle" font-weight="bold">Fe³⁺  MnO₂</text>

  <!-- OXIDATION label -->
  <text x="145" y="62" font-family="Arial, sans-serif" font-size="9"
        fill="#f59e0b" opacity="0.8">OXIDATION</text>
  <!-- REDUCTION label -->
  <text x="145" y="106" font-family="Arial, sans-serif" font-size="9"
        fill="#60a5fa" opacity="0.8">REDUCTION</text>

  <!-- Centre genome icon (three nested arcs) -->
  <circle cx="100" cy="80" r="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <path d="M 88,72 Q 100,65 112,72" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 88,80 Q 100,73 112,80" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 88,88 Q 100,81 112,88" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>

  <!-- ── CENTRE: title ── -->
  <text x="430" y="70" font-family="'Courier New', monospace" font-size="38"
        fill="#f1f5f9" text-anchor="middle" font-weight="bold" letter-spacing="1">Efesto</text>
  <text x="430" y="100" font-family="Arial, sans-serif" font-size="14"
        fill="#94a3b8" text-anchor="middle">Metal cycling gene annotation · genomes &amp; metagenomes</text>

  <!-- divider -->
  <line x1="175" y1="30" x2="175" y2="130" stroke="#334155" stroke-width="1"/>

  <!-- ── RIGHT: element tiles ── -->
  <!-- Fe -->
  <rect x="640" y="22" width="46" height="52" rx="6" fill="#7c3aed" opacity="0.85"/>
  <text x="663" y="44" font-family="'Courier New', monospace" font-size="20"
        fill="white" text-anchor="middle" font-weight="bold">Fe</text>
  <text x="663" y="58" font-family="Arial, sans-serif" font-size="9"
        fill="#ddd6fe" text-anchor="middle">iron</text>
  <text x="663" y="68" font-family="Arial, sans-serif" font-size="8"
        fill="#c4b5fd" text-anchor="middle">26</text>

  <!-- Mn -->
  <rect x="694" y="22" width="46" height="52" rx="6" fill="#0369a1" opacity="0.85"/>
  <text x="717" y="44" font-family="'Courier New', monospace" font-size="20"
        fill="white" text-anchor="middle" font-weight="bold">Mn</text>
  <text x="717" y="58" font-family="Arial, sans-serif" font-size="9"
        fill="#bae6fd" text-anchor="middle">manganese</text>
  <text x="717" y="68" font-family="Arial, sans-serif" font-size="8"
        fill="#7dd3fc" text-anchor="middle">25</text>

  <!-- Cu -->
  <rect x="748" y="22" width="46" height="52" rx="6" fill="#b45309" opacity="0.85"/>
  <text x="771" y="44" font-family="'Courier New', monospace" font-size="20"
        fill="white" text-anchor="middle" font-weight="bold">Cu</text>
  <text x="771" y="58" font-family="Arial, sans-serif" font-size="9"
        fill="#fde68a" text-anchor="middle">copper</text>
  <text x="771" y="68" font-family="Arial, sans-serif" font-size="8"
        fill="#fcd34d" text-anchor="middle">29</text>

  <!-- Zn -->
  <rect x="640" y="82" width="46" height="52" rx="6" fill="#065f46" opacity="0.85"/>
  <text x="663" y="104" font-family="'Courier New', monospace" font-size="20"
        fill="white" text-anchor="middle" font-weight="bold">Zn</text>
  <text x="663" y="118" font-family="Arial, sans-serif" font-size="9"
        fill="#a7f3d0" text-anchor="middle">zinc</text>
  <text x="663" y="128" font-family="Arial, sans-serif" font-size="8"
        fill="#6ee7b7" text-anchor="middle">30</text>

  <!-- Mo -->
  <rect x="694" y="82" width="46" height="52" rx="6" fill="#7f1d1d" opacity="0.85"/>
  <text x="717" y="104" font-family="'Courier New', monospace" font-size="20"
        fill="white" text-anchor="middle" font-weight="bold">Mo</text>
  <text x="717" y="118" font-family="Arial, sans-serif" font-size="9"
        fill="#fca5a5" text-anchor="middle">molybdenum</text>
  <text x="717" y="128" font-family="Arial, sans-serif" font-size="8"
        fill="#f87171" text-anchor="middle">42</text>

  <!-- As -->
  <rect x="748" y="82" width="46" height="52" rx="6" fill="#4d7c0f" opacity="0.85"/>
  <text x="771" y="104" font-family="'Courier New', monospace" font-size="20"
        fill="white" text-anchor="middle" font-weight="bold">As</text>
  <text x="771" y="118" font-family="Arial, sans-serif" font-size="9"
        fill="#d9f99d" text-anchor="middle">arsenic</text>
  <text x="771" y="128" font-family="Arial, sans-serif" font-size="8"
        fill="#bef264" text-anchor="middle">33</text>

  <!-- right divider -->
  <line x1="628" y1="30" x2="628" y2="130" stroke="#334155" stroke-width="1"/>
</svg>
