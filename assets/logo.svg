<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="920" height="160">
  <defs>
    <marker id="arrowOx" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="160" rx="14" fill="url(#bg)"/>

  <!-- ── LEFT: redox cycling wheel ──────────────────────────────────── -->
  <!-- cx=93, cy=80, r=55 → fits 38–148 horizontally -->

  <!-- guide ring -->
  <circle cx="93" cy="80" r="55" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Oxidation arc top (amber) — left-to-right across the top -->
  <path d="M 53,50 A 55,55 0 0,1 133,50"
        fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrowOx)"/>

  <!-- Reduction arc bottom (blue) — right-to-left across the bottom -->
  <path d="M 133,110 A 55,55 0 0,1 53,110"
        fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"
        marker-end="url(#arrowRed)"/>

  <!-- Reduced forms label (bottom, inside arc) -->
  <text x="93" y="124" font-family="'Courier New', monospace" font-size="11"
        fill="#60a5fa" text-anchor="middle" font-weight="bold">Fe²⁺ · Mn²⁺</text>

  <!-- Oxidised forms label (top, inside arc) -->
  <text x="93" y="44" font-family="'Courier New', monospace" font-size="11"
        fill="#f59e0b" text-anchor="middle" font-weight="bold">Fe³⁺ · MnO₂</text>

  <!-- OXIDATION label — left of arc -->
  <text x="9" y="67" font-family="Arial, sans-serif" font-size="8"
        fill="#f59e0b" opacity="0.75" transform="rotate(-55,9,67)">OXIDATION</text>

  <!-- REDUCTION label — right of arc -->
  <text x="176" y="100" font-family="Arial, sans-serif" font-size="8"
        fill="#60a5fa" opacity="0.75" transform="rotate(-55,176,100)">REDUCTION</text>

  <!-- Centre genome icon -->
  <circle cx="93" cy="80" r="19" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <path d="M 81,73 Q 93,66 105,73" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 81,80 Q 93,73 105,80" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 81,87 Q 93,80 105,87" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>

  <!-- left divider -->
  <line x1="185" y1="25" x2="185" y2="135" stroke="#334155" stroke-width="1"/>

  <!-- ── CENTRE: title ────────────────────────────────────────────── -->
  <text x="437" y="78" font-family="'Courier New', monospace" font-size="42"
        fill="#f1f5f9" text-anchor="middle" font-weight="bold" letter-spacing="2">Efesto</text>
  <text x="437" y="108" font-family="Arial, sans-serif" font-size="13.5"
        fill="#64748b" text-anchor="middle">Metal cycling gene annotation · genomes &amp; metagenomes</text>

  <!-- right divider -->
  <line x1="690" y1="25" x2="690" y2="135" stroke="#334155" stroke-width="1"/>

  <!-- ── RIGHT: element tiles (3×2 grid, 64×58px, 7px gap) ────────── -->
  <!-- Row 1 y=22, Row 2 y=87  |  Col cx: 727, 798, 869             -->

  <!-- Fe  26  purple -->
  <rect x="695" y="22" width="64" height="58" rx="7" fill="#5b21b6" opacity="0.9"/>
  <text x="727" y="52" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Fe</text>
  <text x="750" y="72" font-family="Arial, sans-serif" font-size="9"
        fill="#ddd6fe" text-anchor="end">26</text>
  <text x="700" y="32" font-family="Arial, sans-serif" font-size="8"
        fill="#c4b5fd">iron</text>

  <!-- Mn  25  blue -->
  <rect x="766" y="22" width="64" height="58" rx="7" fill="#0369a1" opacity="0.9"/>
  <text x="798" y="52" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Mn</text>
  <text x="821" y="72" font-family="Arial, sans-serif" font-size="9"
        fill="#bae6fd" text-anchor="end">25</text>
  <text x="771" y="32" font-family="Arial, sans-serif" font-size="8"
        fill="#7dd3fc">manganese</text>

  <!-- Cu  29  amber -->
  <rect x="837" y="22" width="64" height="58" rx="7" fill="#92400e" opacity="0.9"/>
  <text x="869" y="52" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Cu</text>
  <text x="892" y="72" font-family="Arial, sans-serif" font-size="9"
        fill="#fde68a" text-anchor="end">29</text>
  <text x="842" y="32" font-family="Arial, sans-serif" font-size="8"
        fill="#fcd34d">copper</text>

  <!-- Zn  30  teal -->
  <rect x="695" y="87" width="64" height="58" rx="7" fill="#065f46" opacity="0.9"/>
  <text x="727" y="117" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Zn</text>
  <text x="750" y="137" font-family="Arial, sans-serif" font-size="9"
        fill="#a7f3d0" text-anchor="end">30</text>
  <text x="700" y="97" font-family="Arial, sans-serif" font-size="8"
        fill="#6ee7b7">zinc</text>

  <!-- Mo  42  red -->
  <rect x="766" y="87" width="64" height="58" rx="7" fill="#7f1d1d" opacity="0.9"/>
  <text x="798" y="117" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">Mo</text>
  <text x="821" y="137" font-family="Arial, sans-serif" font-size="9"
        fill="#fca5a5" text-anchor="end">42</text>
  <text x="771" y="97" font-family="Arial, sans-serif" font-size="8"
        fill="#f87171">molybdenum</text>

  <!-- As  33  green -->
  <rect x="837" y="87" width="64" height="58" rx="7" fill="#3f6212" opacity="0.9"/>
  <text x="869" y="117" font-family="'Courier New', monospace" font-size="24"
        fill="white" text-anchor="middle" font-weight="bold">As</text>
  <text x="892" y="137" font-family="Arial, sans-serif" font-size="9"
        fill="#d9f99d" text-anchor="end">33</text>
  <text x="842" y="97" font-family="Arial, sans-serif" font-size="8"
        fill="#bef264">arsenic</text>

</svg>
