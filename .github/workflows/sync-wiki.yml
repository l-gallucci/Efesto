name: Sync wiki

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sync docs/ to wiki
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

          # Copy all docs except index.md (handled separately as Home.md)
          for f in docs/*.md; do
            fname=$(basename "$f")
            [ "$fname" = "index.md" ] && continue
            cp "$f" "wiki/$fname"
          done

          # index.md → Home.md (wiki landing page)
          cp docs/index.md wiki/Home.md

          cd wiki
          git add .
          git diff --cached --quiet && echo "No changes to sync" && exit 0
          git commit -m "Sync wiki from docs/ (${GITHUB_SHA::7})"
          git push
