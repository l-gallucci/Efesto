name: Tests and distribution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y hmmer
      - run: python -m pip install pytest
      - run: python -m pytest -q
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y hmmer
      - run: python -m pip install build cffconvert
      - run: cffconvert --validate
      - run: python -m build
      - run: python scripts/check_distribution.py dist/*.whl dist/*.tar.gz --smoke
