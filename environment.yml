name: efesto
channels:
  - conda-forge
  - bioconda
dependencies:
  # ── Core pipeline ───────────────────────────────────────────────────────────
  - python>=3.9
  - hmmer>=3.3
  - pyrodigal>=3.0
  - pyrodigal-gv>=0.3.0
  - numpy                    # pyrodigal internal arrays; also handles UniOP np.int64 output
  - pip

  # ── Coverage heatmap (optional, only needed for --bam / --depth) ───────────
  - samtools>=1.15

  # ── Visualisation — scripts/plot_heatmap.R (optional) ─────────────────────
  - r-base>=4.1
  - r-pheatmap
  - r-plotly
  - r-htmlwidgets
  - r-optparse
  - r-rcolorbrewer
  - r-scales

  # ── Efesto Python package ───────────────────────────────────────────────────
  - pip:
    - -e .

# ── UniOP operon prediction (optional, --operon_prediction) ─────────────────
# UniOP is NOT on conda or pip — install manually:
#
#   git clone https://github.com/hongsua/UniOP.git
#   efesto ... --operon_prediction --uniop_path /path/to/UniOP/src/UniOP
#
# Su H, Zhang R, Söding J (2024) bioRxiv doi:10.1101/2024.11.11.623000
