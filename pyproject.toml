[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "efesto"
version = "1.0.0"
description = "Efesto: HMM-based annotation of metal cycling and resistance genes in genomes and metagenomes"
readme = "README.md"
license = "MIT AND LicenseRef-ThirdParty-Models"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"

# HMMER and other executables are installed separately. Gene calling is an
# optional pip extra; FAA-only runs use the standard-library core.
dependencies = []
authors = [
    { name = "Luigi Gallucci" },
    { name = "Anke Meyerdierks" },
    { name = "Rudolf Amann" },
]


keywords = [
    "bioinformatics", "metagenomics", "iron cycling",
    "metal resistance", "HMM", "annotation"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
gene-calling = ["pyrodigal>=3.0", "pyrodigal-gv>=0.3.0"]

[project.urls]
Repository = "https://github.com/l-gallucci/Efesto"
Documentation = "https://l-gallucci.github.io/Efesto/"
Issues = "https://github.com/l-gallucci/Efesto/issues"


[project.scripts]
efesto = "efesto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["efesto", "efesto.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
