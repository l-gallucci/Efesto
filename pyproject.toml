[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "efesto"
version = "1.0.6"
description = "Efesto: HMM-based annotation of metal cycling and resistance genes in genomes and metagenomes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

# Pure Python standard library only at import time — pyrodigal/pyrodigal-gv
# are deferred imports (only loaded inside gene_calling.py's run_prodigal(),
# so `pip install efesto` alone succeeds and non-gene-calling modules stay
# testable without them installed). They ARE required at runtime for
# --fna_dir gene calling — installed via conda from environment.yml, not
# declared here. See note in docs/hmm_library_curation.md-adjacent packaging
# notes if publishing a standalone PyPI/conda-forge release: either declare
# them here too, or keep this deferred-import + conda-only pattern and
# document it clearly for pip-only users.
dependencies = []

keywords = [
    "bioinformatics", "metagenomics", "iron cycling",
    "metal resistance", "HMM", "annotation"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

[project.scripts]
efesto = "efesto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
